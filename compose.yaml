name: platform-agent

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eva}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db-setup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend-environment
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-eva}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-admin}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-https://litellm-gateway.delightfulpebble-214bf13c.eastus2.azurecontainerapps.io/v1}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-gpt-5-nano}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      EMBED_METHOD: ${EMBED_METHOD:-numpy}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-change-me}
      SKIP_VENV_REEXEC: "true"
    command: ["python", "scripts/db_setup.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/v1/live', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:5000}
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  backend-data:
  backend-logs:
